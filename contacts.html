<link rel="stylesheet" href="contacts.css">

<section class="contact-section" id="contact">
    <h2>Contact Me</h2>
    <p class="contact-info">I’d love to hear from you! Feel free to reach out via email, or connect with me on social media.</p>
  
    <div class="contact-container">
      <form class="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="Your Name">
  
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="Your Email">
  
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required placeholder="Your Message"></textarea>
  
        <button type="submit" class="cta-button">Send Message</button>
      </form>
  
      <div class="social-links">
        <h3>Or Connect With Me</h3>
        <ul>
          <li><a href="https://twitter.com/yourhandle" target="_blank">Twitter</a></li>
          <li><a href="https://linkedin.com/in/yourprofile" target="_blank">LinkedIn</a></li>
          <li><a href="https://github.com/yourusername" target="_blank">GitHub</a></li>
        </ul>
      </div>
    </div>
  </section>
